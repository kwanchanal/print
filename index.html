<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Radial Field Shapes</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="gallery-shell">
      <aside class="control-panel" aria-label="Artwork controls">
        <button id="randomize-button" class="randomize-button" type="button">RANDOMIZE ALL</button>
        <h1>RADIAL FIELD SHAPES</h1>
        <section class="control-group"><button class="section-toggle" type="button" aria-expanded="false" aria-controls="canvas-panel"><span>+ CANVAS</span></button><div id="canvas-panel" class="section-content" hidden></div></section>
        <section class="control-group"><button class="section-toggle" type="button" aria-expanded="false" aria-controls="shape-one-panel"><span>+ SHAPE 1</span></button><div id="shape-one-panel" class="section-content" hidden><p>PRIMARY FIELD / ACTIVE</p></div></section>
        <section class="control-group"><button class="section-toggle" type="button" aria-expanded="true" aria-controls="contour-panel"><span>+ CONTOUR</span><input class="square-check" type="checkbox" checked aria-label="Enable contour" /></button><div id="contour-panel" class="section-content" hidden></div></section>
        <section class="control-group"><button class="section-toggle" type="button" aria-expanded="false" aria-controls="breakup-panel"><span>+ BREAKUP FIELD</span></button><div id="breakup-panel" class="section-content" hidden><button id="reset-offset" class="outline-button" type="button">RESET OFFSET</button></div></section>
        <section class="control-group"><button class="section-toggle" type="button" aria-expanded="false" aria-controls="animation-panel"><span>+ ANIMATION</span></button><div id="animation-panel" class="section-content" hidden></div></section>
        <div class="downloads"><button class="outline-button" data-download="svg" type="button">DOWNLOAD SVG</button><button class="outline-button" data-download="animated" type="button">DOWNLOAD ANIMATED SVG</button><button class="outline-button" data-download="webm" type="button">DOWNLOAD WEBM VIDEO</button><button class="outline-button" data-download="png" type="button">DOWNLOAD PNG</button></div>
      </aside>
      <section class="toolbar" aria-label="Artwork controls">
          <label for="artwork-select">SELECT COLLECTION</label>
        <div class="sheet-select">
          <button
            id="artwork-select"
            class="sheet-select-button"
            type="button"
            aria-haspopup="listbox"
            aria-expanded="false"
          ></button>
          <ul id="artwork-options" class="sheet-options" role="listbox"></ul>
        </div>
      </section>

      <section class="viewer" aria-live="polite">
        <div id="artwork-stage"></div>
      </section>

      <section class="frame-controls"><h2>FRAME</h2><div class="ratio-grid" id="ratio-grid"></div></section>

      <section class="artwork-meta" aria-label="Artwork details">
        <h1 id="artwork-title"></h1>
        <p id="artwork-description"></p>
        <div id="artwork-tags" class="tags"></div>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
