<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>print de mar</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%A0%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="gallery-shell">
      <aside class="control-panel" aria-label="Artwork controls">
        <h1>PRINT STUDIO</h1>
        <section class="control-group"><button class="section-toggle" type="button" aria-expanded="false" aria-controls="canvas-panel"><span>+ CANVAS</span></button><div id="canvas-panel" class="section-content" hidden></div></section>
        <div class="downloads"><button class="outline-button" data-download="svg" type="button">DOWNLOAD SVG</button><button class="outline-button" data-download="png" type="button">DOWNLOAD PNG</button></div>
      </aside>
      <section class="toolbar" aria-label="Artwork controls">
          <label for="artwork-select">SELECT COLLECTION</label>
        <div class="sheet-select">
          <button
            id="artwork-select"
            class="sheet-select-button"
            type="button"
            aria-haspopup="listbox"
            aria-expanded="false"
          ></button>
          <ul id="artwork-options" class="sheet-options" role="listbox"></ul>
        </div>
      </section>

      <section class="viewer" aria-live="polite">
        <div id="artwork-stage"></div>
      </section>

      <section class="frame-controls"><h2>FRAME</h2><div class="ratio-grid" id="ratio-grid"></div></section>

      <section class="artwork-meta" aria-label="Artwork details">
        <h1 id="artwork-title"></h1>
        <p id="artwork-description"></p>
        <div id="artwork-tags" class="tags"></div>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
